<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Η Περιπέτεια της Λουκίας</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100dvh; overflow: hidden;
            touch-action: none; /* No zooming/scrolling on mobile */
        }
        #game-container {
            position: relative;
            width: 100vw; height: 100dvh;
            background-color: #000;
            overflow: hidden;
            padding-bottom: 75px; /* ΜΕΙΩΘΗΚΕ στα 2/3 (από 110px) */
            box-sizing: border-box;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            transition: opacity 0.3s;
            z-index: 20;
        }
        .hidden { opacity: 0; pointer-events: none !important; }
        
        h1 {
            font-size: 8vw; margin-bottom: 10px;
            color: #fce473; text-shadow: 4px 4px 0px #9b59b6;
            text-align: center;
        }
        @media(min-width: 800px) { h1 { font-size: 3rem; } }
        p { font-size: 1.2rem; text-align: center; max-width: 80%; line-height: 1.5; margin-bottom: 20px;}
        .btn {
            background: #9b59b6; border: 4px solid #fff;
            padding: 15px 30px; font-size: 1.5rem; font-weight: bold;
            color: #fff; cursor: pointer; border-radius: 10px;
            font-family: inherit; box-shadow: 0 5px 0 #5e35b1;
            transition: transform 0.1s; pointer-events: auto;
            margin: 5px;
        }
        .btn:active { transform: translateY(5px); box-shadow: 0 0 0 #5e35b1; }
        
        #touch-controls {
            position: absolute; bottom: 15px; left: 0; width: 100%; /* Προσαρμοσμένο στο κέντρο του μαύρου κενού */
            padding: 0 40px; box-sizing: border-box;
            display: flex; justify-content: space-between;
            pointer-events: none; z-index: 10;
        }
        .touch-group { display: flex; gap: 20px; }
        .touch-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255,255,255,0.8);
            color: white; font-size: 1.5rem; /* ΜΙΚΡΥΝΑΝ ΣΤΑ 2/3 */
            width: 45px; height: 45px; /* Από 60x60 σε 45x45 */
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
            backdrop-filter: blur(4px);
        }
        .touch-btn:active { background: rgba(255, 255, 255, 0.7); transform: scale(0.9); }
        .btn-action { background: rgba(255, 50, 50, 0.5); border-color: #ff9a9e; }
        .btn-action:active { background: rgba(255, 50, 50, 0.9); }
        
        #hud {
            position: absolute; top: 15px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 30px;
            font-size: 1.5rem; color: white; text-shadow: 2px 2px 0 #000;
            pointer-events: none; z-index: 5; font-weight: bold;
        }
        #restart-btn-hud {
            position: absolute; top: 10px; right: 15px;
            padding: 5px 10px; font-size: 1rem; background: rgba(255, 0, 0, 0.7);
            border: 2px solid white; color: white; border-radius: 5px;
            cursor: pointer; pointer-events: auto; z-index: 10;
        }
        #menu-btn-hud {
            position: absolute; top: 10px; left: 15px;
            padding: 5px 10px; font-size: 1rem; background: #9b59b6;
            border: 2px solid white; color: white; border-radius: 5px;
            cursor: pointer; pointer-events: auto; z-index: 10;
        }
        #level-select-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.9); transition: opacity 0.3s; z-index: 25;
        }
        .level-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px;
            margin-top: 20px; pointer-events: auto;
        }
        .level-btn {
            background: #5e35b1; border: 2px solid #fff; padding: 10px; 
            font-size: 1.5rem; font-weight: bold; color: #fff; cursor: pointer; 
            border-radius: 10px; text-align: center; width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
        }
        .level-btn:active { background: #9b59b6; transform: scale(0.95); }
        
        #portrait-warning {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #fff; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; font-size: 1.5rem; padding: 20px; box-sizing: border-box;
        }
        #portrait-warning svg { 
            width: 80px; height: 80px; margin-bottom: 20px; fill: white; 
            animation: rotatePhone 2s infinite ease-in-out; 
        }
        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex; }
            #game-container { display: none; }
        }

        @media (hover: hover) and (pointer: fine) { 
            #touch-controls { display: none; } 
            #game-container { padding-bottom: 0; } /* Στον υπολογιστή το παιχνίδι πιάνει όλη την οθόνη */
        }
    </style>

        function drawPixelGrid(ctx, x, y, w, h, gridStrArray, colorMap) {
            const rows = gridStrArray.length;
            const cols = gridStrArray[0].length;
            const pW = w / cols;
            const pH = h / rows;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const char = gridStrArray[r][c];
                    if (char !== '.') {
                        ctx.fillStyle = colorMap[char];
                        ctx.fillRect(x + c * pW, y + r * pH, Math.ceil(pW), Math.ceil(pH));
                    }
                }
            }
        }

        class Entity {
            constructor(x, y, w, h) {
                this.x = x; this.y = y; this.w = w; this.h = h;
                this.vx = 0; this.vy = 0;
                this.onGround = false;
                this.dead = false;
            }
            updatePhysics() {
                this.vy += GRAVITY;
                
                // X collision
                this.x += this.vx;
                this.handleMapCollision('x');
                
                // Y collision
                this.y += this.vy;
                this.onGround = false;
                this.handleMapCollision('y');

                if (this.y > mapHeight * TS) this.dead = true;
            }
            handleMapCollision(axis) {
                let leftTile = Math.floor(this.x / TS);
                let rightTile = Math.floor((this.x + this.w - 0.1) / TS);
                let topTile = Math.floor(this.y / TS);
                let bottomTile = Math.floor((this.y + this.h - 0.1) / TS);

                if (leftTile < 0) leftTile = 0;
                if (rightTile >= mapWidth) rightTile = mapWidth - 1;
                if (topTile < 0) topTile = 0;
                if (bottomTile >= mapHeight) bottomTile = mapHeight - 1;

                for (let r = topTile; r <= bottomTile; r++) {
                    for (let c = leftTile; c <= rightTile; c++) {
                        let tile = map[r][c];
                        if (isSolid(tile)) {
                            if (axis === 'x') {
                                if (this.vx > 0) { this.x = c * TS - this.w; this.vx = 0; }
                                else if (this.vx < 0) { this.x = c * TS + TS; this.vx = 0; }
                            } else if (axis === 'y') {
                                if (this.vy > 0) {
                                    this.y = r * TS - this.h;
                                    this.vy = 0;
                                    this.onGround = true;
                                } else if (this.vy < 0) {
                                    this.y = r * TS + TS;
                                    this.vy = 0;
                                    if(this instanceof Player && (tile === 'B' || tile === '?' || tile === '*')) {
                                        hitBlock(c, r, tile);
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        class Player extends Entity {
            constructor(x, y) {
                super(x, y, 30, 40);
                this.facingRight = true;
                this.power = 0; 
                this.invulnTimer = 0;
                this.shootCooldown = 0;
                this.frameX = 0;
                this.animTimer = 0;
            }
            update() {
                if(this.invulnTimer > 0) this.invulnTimer--;
                if(this.shootCooldown > 0) this.shootCooldown--;

                let isMoving = false;
                if ((keys['ArrowLeft'] || keys['KeyA']) && !keys['ArrowRight']) {
                    this.vx -= 1; this.facingRight = false; isMoving = true;
                } else if ((keys['ArrowRight'] || keys['KeyD']) && !keys['ArrowLeft']) {
                    this.vx += 1; this.facingRight = true; isMoving = true;
                } else {
                    this.vx *= FRICTION;
                }
                
                if (this.vx > MAX_SPEED) this.vx = MAX_SPEED;
                if (this.vx < -MAX_SPEED) this.vx = -MAX_SPEED;

                if ((keys['ArrowUp'] || keys['KeyW']) && this.onGround) {
                    this.vy = JUMP_FORCE;
                    this.onGround = false;
                }

                if (keys['Space'] && this.power === 1 && this.shootCooldown <= 0) {
                    fireballs.push(new Fireball(this.x + (this.facingRight?this.w:-10), this.y + 10, this.facingRight));
                    this.shootCooldown = 20;
                }

                this.updatePhysics();

                if (isMoving && this.onGround) {
                    this.animTimer++;
                    if (this.animTimer > 5) {
                        this.frameX = (this.frameX + 1) % 4;
                        this.animTimer = 0;
                    }
                } else if (!this.onGround) {
                    this.frameX = 1; 
                } else {
                    this.frameX = 0; 
                }

                if (this.x < 0) { this.x = 0; this.vx = 0; }
                
                let cx = Math.floor((this.x + this.w/2)/TS);
                let cy = Math.floor((this.y + this.h/2)/TS);
                if (cy >= 0 && cy < mapHeight && cx >= 0 && cx < mapWidth) {
                    if (map[cy][cx] === 'W') levelComplete();
                    if (map[cy][cx] === 'F' && this.invulnTimer <= 0) this.takeDamage();
                }

                if (this.y > mapHeight * TS) this.takeDamage(true); 
            }
            takeDamage(instant = false) {
                if (this.invulnTimer > 0 && !instant) return;
                if (this.power === 1 && !instant) {
                    this.power = 0;
                    this.invulnTimer = 60;
                    hudHp.innerText = "HP: ❤️";
                } else {
                    gameState = 'DEAD';
                    restartBtnMenu.classList.remove('hidden');
                    startBtn.classList.add('hidden');
                    showUI("Ωχ όχι!", "Έχασες μια ζωή.", "");
                }
            }
            draw(ctx) {
                if (this.invulnTimer > 0 && Math.floor(frameCount/5)%2 === 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Λουκία', this.w / 2, -5);

                if (!this.facingRight) {
                    ctx.scale(-1, 1);
                    ctx.translate(-this.w, 0);
                }

                const P = '#9c27b0'; const S = '#ffcc80'; const B = '#000000'; 
                const D = '#ffb300'; const X = '#4e342e'; const L = '#ff9800'; 
                
                let sprite;
                if (!this.onGround) {
                    sprite = [
                        "...PPPP...", ".PPPPPP...", ".PPSSSS...", ".P.SBBB...",
                        "PP.SSSS...", "P...LL....", "...DXXD...", "...XDDX...",
                        "...DXXD...", "...DDDD...", "....XX....", "....XX....",
                        "....XX....", "....XX...."
                    ];
                } else if (this.frameX % 2 === 0) {
                    sprite = [
                        "...PPPP...", ".PPPPPP...", ".PPSSSS...", ".P.SBBB...",
                        "PP.SSSS...", "P...LL....", "...DXXD...", "...XDDX...",
                        "...DXXD...", "...DDDD...", "...XX.XX..", "...X...X..",
                        "...X...X..", "...X...X.."
                    ];
                } else {
                    sprite = [
                        "...PPPP...", ".PPPPPP...", ".PPSSSS...", ".P.SBBB...",
                        "PP.SSSS...", "P...LL....", "...DXXD...", "...XDDX...",
                        "...DXXD...", "...DDDD...", "....XX....", "...XX.....",
                        "...X......", "...X......"
                    ];
                }

                const colors = {'P': P, 'S': S, 'B': B, 'D': D, 'X': X, 'L': L};
                drawPixelGrid(ctx, 0, 0, this.w, this.h, sprite, colors);
                
                ctx.restore();
            }
        }

        class Enemy extends Entity {
            constructor(x, y) {
                super(x, y, 30, 30);
                this.vx = -1.5;
            }
            update() {
                let oldX = this.x;
                this.updatePhysics();
                if (this.x === oldX) this.vx *= -1; 
            }
            draw(ctx) {
                const sprite = [
                    "....RRRR....", "..RRRRRRRR..", ".RRRRWWWWWW.", ".RRRRWEWWEE.",
                    "RRRRRRWWWWWW", "RRRRRRRRRRRR", "....SSSS....", "...KK..KK..."
                ];
                const colors = {'R':'#d32f2f','W':'#fff','E':'#000','S':'#ffcc80','K':'#3e2723'};
                drawPixelGrid(ctx, this.x, this.y, this.w, this.h, sprite, colors);
            }
        }

        class Boss extends Entity {
            constructor(x, y) {
                super(x, y, 60, 60);
                this.hp = 3;
                this.vx = 0; 
                this.jumpTimer = 100;
                this.invulnTimer = 0;
            }
            update() {
                if(this.invulnTimer > 0) this.invulnTimer--;
                
                if (player && !player.dead) {
                    let speed = 0.6; 
                    let centerX = this.x + this.w / 2;
                    let playerCenterX = player.x + player.w / 2;
                    
                    if (playerCenterX < centerX - 10) { this.vx = -speed; } 
                    else if (playerCenterX > centerX + 10) { this.vx = speed; } 
                    else { this.vx = 0; }
                }

                this.updatePhysics();
                
                if (this.x < 0) this.x = 0;
                if (this.x + this.w > mapWidth * TS) this.x = mapWidth * TS - this.w;
                
                this.jumpTimer--;
                if(this.jumpTimer <= 0 && this.onGround) {
                    this.vy = -12;
                    this.jumpTimer = 80 + Math.random()*60;
                }
            }
            takeDamage() {
                if (this.invulnTimer > 0) return;
                this.hp--;
                this.invulnTimer = 40;
                if (this.hp <= 0) {
                    this.dead = true;
                    for(let r=0; r<mapHeight; r++) {
                        for(let c=0; c<mapWidth; c++) {
                            if(map[r][c] === 'C') map[r][c] = '.';
                        }
                    }
                    createParticles(this.x+this.w/2, this.y+this.h/2, '#4CAF50', 20);
                }
            }
            draw(ctx) {
                if (this.invulnTimer > 0 && Math.floor(frameCount/5)%2 === 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.vx > 0) { ctx.scale(-1, 1); ctx.translate(-this.w, 0); }
                const sprite = [
                    ".......GGGG.....", "......GGGGGG....", ".....GGWWWGGG...", "....GGGWEWGGG...",
                    "....GGGGGGGG....", ".......GGG......", ".GGGGGGGGGGGGGG.", "GGGGYGGGGGGYGGGG",
                    "GGGGYYYYYYYYGGGG", ".GGGGGGGGGGGGGG.", "..GG........GG..", "..GG........GG..",
                    "..GG........GG..", ".KKK........KKK."
                ];
                const colors = {'G':'#2e7d32','W':'#fff','E':'#f44336','Y':'#fbc02d','K':'#000'};
                drawPixelGrid(ctx, 0, 0, this.w, this.h, sprite, colors);
                ctx.restore();
            }
        }

        class Item extends Entity {
            constructor(x, y, type) {
                super(x, y, 30, 30);
                this.type = type;
                this.vy = -5;
            }
            update() { this.updatePhysics(); }
            draw(ctx) {
                const sprite = [
                    "...RRRR...", "..RYYYYR..", ".RYYWWYYR.", ".RYYWWYYR.",
                    "..RYYYYR..", "...RRRR...", "....GG....", "...GGGG..."
                ];
                const colors = {'R':'#e91e63','Y':'#ffeb3b','W':'#fff','G':'#4caf50'};
                drawPixelGrid(ctx, this.x, this.y, this.w, this.h, sprite, colors);
            }
        }

        class Fireball extends Entity {
            constructor(x, y, right) {
                super(x, y, 12, 12);
                this.vx = right ? 8 : -8;
                this.vy = 2;
                this.bounces = 0;
            }
            update() {
                this.vy += GRAVITY/2;
                this.x += this.vx;
                this.y += this.vy;
                
                let cx = Math.floor((this.x+this.w/2)/TS);
                let cy = Math.floor((this.y+this.h/2)/TS);
                if(cy>=0 && cy<mapHeight && cx>=0 && cx<mapWidth) {
                    if(isSolid(map[cy][cx])) {
                        if(this.vy > 0) {
                            this.vy = -5;
                            this.bounces++;
                            if(this.bounces > 3) this.dead = true;
                        } else {
                            this.dead = true;
                        }
                    }
                }
                if(this.y > mapHeight*TS) this.dead = true;
            }
            draw(ctx) {
                ctx.fillStyle = '#ff5722';
                ctx.beginPath(); ctx.arc(this.x+this.w/2, this.y+this.h/2, this.w/2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath(); ctx.arc(this.x+this.w/2, this.y+this.h/2, this.w/4, 0, Math.PI*2); ctx.fill();
            }
        }

        function isSolid(char) {
            return ['G', 'D', 'B', '?', '*', 'P', 'p', 'L', 'l', 'C'].includes(char);
        }

        function hitBlock(c, r, tile) {
            if (tile === 'B') {
                map[r][c] = '.';
                createParticles(c*TS + TS/2, r*TS + TS/2, '#795548', 10);
            } else if (tile === '?' || tile === '*') {
                map[r][c] = 'e';
                if (tile === '?') {
                    entities.push(new Item(c*TS + 5, r*TS - 30, 'flower'));
                } else {
                    createParticles(c*TS + TS/2, r*TS, '#ffeb3b', 5); 
                }
            }
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*10, vy: (Math.random()-1)*10,
                    life: 30, color: color
                });
            }
        }

        let player;
        
        function startGame() {
            loadLevel(currentLevelIndex);
            gameState = 'PLAYING';
            uiLayer.classList.add('hidden');
        }

        function levelComplete() {
            currentLevelIndex++;
            if (currentLevelIndex >= levels.length) {
                gameState = 'WIN';
                restartBtnMenu.classList.remove('hidden');
                startBtn.classList.add('hidden');
                showUI("Τα Κατάφερες!! ", "Έσωσες την μικρη Κοπριτω!", "");
            } else {
                loadLevel(currentLevelIndex);
            }
        }

        function loadLevel(idx) {
            let layout = levels[idx];
            mapHeight = layout.length;
            mapWidth = layout[0].length;
            map = [];
            entities = [];
            fireballs = [];
            particles = [];
            
            for (let r = 0; r < mapHeight; r++) {
                let row = [];
                for (let c = 0; c < mapWidth; c++) {
                    let char = layout[r][c];
                    if (char === 'E') {
                        entities.push(new Enemy(c*TS, r*TS));
                        row.push('.');
                    } else if (char === 'O') {
                        entities.push(new Boss(c*TS, r*TS - 20));
                        row.push('.');
                    } else {
                        row.push(char);
                    }
                }
                map.push(row);
            }
            player = new Player(50, 100);
            keys = {};
            hudLevel.innerText = `Level: ${idx + 1}`;
            hudHp.innerText = player.power === 1 ? "HP: ❤️❤️" : "HP: ❤️";
        }

        function checkEntityCollisions() {
            if(!player) return;
            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                if (!ent || ent.dead) continue;
                
                if (player.x < ent.x + ent.w && player.x + player.w > ent.x &&
                    player.y < ent.y + ent.h && player.y + player.h > ent.y) {
                    
                    if (ent instanceof Item) {
                        ent.dead = true;
                        player.power = 1; 
                        hudHp.innerText = "HP: ❤️❤️";
                        createParticles(player.x+player.w/2, player.y, '#ffeb3b', 15);
                    } else if (ent instanceof Enemy || ent instanceof Boss) {
                        if (player.vy > 0 && player.y + player.h < ent.y + ent.h/2) {
                            player.vy = JUMP_FORCE * 0.8; 
                            if(ent instanceof Boss) {
                                ent.takeDamage();
                            } else {
                                ent.dead = true;
                                createParticles(ent.x+ent.w/2, ent.y+ent.h/2, '#d32f2f', 10);
                            }
                        } else {
                            player.takeDamage();
                        }
                    }
                }

                if(ent instanceof Enemy || ent instanceof Boss) {
                    for(let j=fireballs.length-1; j>=0; j--) {
                        let fb = fireballs[j];
                        if (fb && !fb.dead && fb.x < ent.x + ent.w && fb.x + fb.w > ent.x &&
                            fb.y < ent.y + ent.h && fb.y + fb.h > ent.y) {
                            fb.dead = true;
                            if(ent instanceof Boss) {
                                ent.takeDamage();
                            } else {
                                ent.dead = true;
                                createParticles(ent.x+ent.w/2, ent.y+ent.h/2, '#ff9800', 10);
                            }
                        }
                    }
                }
            }

            if (currentLevelIndex === 9 && (entities.length === 0 || (entities.length>0 && entities[0].dead))) {
                let cx = Math.floor((player.x + player.w/2)/TS);
                if(cx >= mapWidth - 4) {
                    levelComplete();
                }
            }
        }

        function drawMap() {
            let theme = themes[currentLevelIndex % themes.length];
            
            if (bgImg.complete && bgImg.width > 0) {
                let bgX = -(cameraX * 0.5) % canvas.width;
                ctx.drawImage(bgImg, bgX, 0, canvas.width, canvas.height);
                if (bgX < 0) {
                    ctx.drawImage(bgImg, bgX + canvas.width, 0, canvas.width, canvas.height);
                }
            } else {
                let grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grd.addColorStop(0, theme.bgTop);
                grd.addColorStop(1, theme.bgBot);
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.save();
            ctx.translate(Math.floor(-cameraX), 0);

            for (let r = 0; r < mapHeight; r++) {
                for (let c = 0; c < mapWidth; c++) {
                    let tile = map[r][c];
                    let tx = c * TS;
                    let ty = r * TS;
                    
                    if (tx + TS < cameraX || tx > cameraX + canvas.width) continue;

                    if (tile === 'G') {
                        ctx.fillStyle = theme.ground; ctx.fillRect(tx, ty, TS, TS);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(tx, ty, TS, 5);
                    } else if (tile === 'D') {
                        ctx.fillStyle = theme.dirt; ctx.fillRect(tx, ty, TS, TS);
                    } else if (tile === 'B') {
                        ctx.fillStyle = '#e65100'; ctx.fillRect(tx, ty, TS, TS);
                        ctx.strokeStyle = '#000'; ctx.strokeRect(tx, ty, TS, TS);
                    } else if (tile === '?' || tile === '*') {
                        ctx.fillStyle = '#ffb300'; ctx.fillRect(tx, ty, TS, TS);
                        ctx.strokeStyle = '#fff'; ctx.strokeRect(tx, ty, TS, TS);
                        ctx.fillStyle = '#fff'; ctx.font = '24px Courier'; ctx.fillText('?', tx+12, ty+28);
                    } else if (tile === 'e') {
                        ctx.fillStyle = '#795548'; ctx.fillRect(tx, ty, TS, TS); 
                    } else if (tile === 'P') { 
                        ctx.fillStyle = '#4CAF50'; ctx.fillRect(tx-2, ty, TS+4, TS);
                        ctx.strokeStyle = '#000'; ctx.strokeRect(tx-2, ty, TS+4, TS);
                    } else if (tile === 'p') { 
                        ctx.fillStyle = '#388E3C'; ctx.fillRect(tx, ty, TS, TS);
                        ctx.strokeStyle = '#000'; ctx.strokeRect(tx, ty, TS, TS);
                    } else if (tile === 'W') { 
                        // Το σημαιάκι με τη φωτογραφία
                        ctx.fillStyle = '#fff'; ctx.fillRect(tx+15, ty, 5, TS);
                        let fImg = flagImages[currentLevelIndex];
                        if (fImg && fImg.complete && fImg.width > 0) {
                            ctx.drawImage(fImg, tx + 20, ty, 30, 30);
                        } else {
                            ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.moveTo(tx+20, ty); ctx.lineTo(tx+40, ty+10); ctx.lineTo(tx+20, ty+20); ctx.fill();
                        }
                    } else if (tile === 'F') { 
                        ctx.fillStyle = '#f44336'; ctx.fillRect(tx, ty+10, TS, TS-10);
                        ctx.fillStyle = '#ff9800'; 
                        if(Math.floor(frameCount/10)%2===0) ctx.fillRect(tx+5, ty+5, 10, 5);
                    } else if (tile === 'C') { 
                        ctx.fillStyle = '#757575'; ctx.fillRect(tx, ty, TS, TS);
                        ctx.fillStyle = '#000'; ctx.fillRect(tx+5, ty+5, TS-10, TS-10);
                        if (dogImg.complete && dogImg.width > 0) {
                            ctx.drawImage(dogImg, tx+5, ty+5, TS-10, TS-10);
                        }
                        ctx.fillStyle = '#9e9e9e'; 
                        ctx.fillRect(tx+10, ty, 4, TS); ctx.fillRect(tx+26, ty, 4, TS);
                    }
                }
            }

            entities.forEach(ent => {
                if (ent && typeof ent.draw === 'function') ent.draw(ctx);
            });
            fireballs.forEach(fb => {
                if (fb && typeof fb.draw === 'function') fb.draw(ctx);
            });
            if (player && typeof player.draw === 'function') {
                player.draw(ctx);
            }
            particles.forEach(p => {
                if (p) {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, 4, 4);
                }
            });

            ctx.restore();
        }

        function showUI(title, subtitle, btnText) {
            uiLayer.classList.remove('hidden');
            titleText.innerText = title;
            subtitleText.innerText = subtitle;
            if (btnText) startBtn.innerText = btnText;
        }

        function gameLoop() {
            frameCount++;

            if (gameState === 'PLAYING') {
                if (player) player.update();
                entities.forEach(ent => { if(ent) ent.update() });
                fireballs.forEach(fb => { if(fb) fb.update() });
                
                checkEntityCollisions();

                entities = entities.filter(ent => ent && !ent.dead);
                fireballs = fireballs.filter(fb => fb && !fb.dead);
                particles = particles.filter(p => {
                    if(!p) return false;
                    p.x += p.vx; p.y += p.vy; p.life--;
                    return p.life > 0;
                });

                if(player) {
                    let targetX = player.x - canvas.width / 2;
                    let maxCameraX = Math.max(0, mapWidth * TS - canvas.width);
                    if (targetX < 0) targetX = 0;
                    if (targetX > maxCameraX) targetX = maxCameraX;
                    cameraX += (targetX - cameraX) * 0.1;
                }
            }

            drawMap();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
